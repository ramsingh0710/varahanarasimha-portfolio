name: CI Pipeline

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: frontend   # 👈 mee folder name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
